name: Dependency Audit

on:
  schedule:
    - cron: '43 5 * * 2'
  workflow_dispatch:
  push:
    paths:
      - requirements-mcp.txt

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-mcp-dependencies:
    name: Audit MCP Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Audit resolved dependency graph
        run: |
          python -m pip install --disable-pip-version-check 'pip-audit==2.10.1'
          pip-audit -r requirements-mcp.txt
      - name: MCP package import smoke test
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --disable-pip-version-check -r requirements-mcp.txt
          python -c 'import intervals_icu_mcp; print("intervals_icu_mcp import: OK")'
